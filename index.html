<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050508">
<title>ENIGMA</title>
<style>
@font-face{font-family:Besan;src:url("./Besan.woff2") format("woff2"),url("./Besan.ttf") format("truetype"),url("./Besan.otf") format("opentype");font-display:swap}
:root{--purple:#8a2eff;--blue:#168cff;--bg:#030305}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff}
body{font-family:Besan,Arial,sans-serif;overflow-x:hidden}
#network{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;background:radial-gradient(circle at 20% 20%,rgba(138,46,255,.08),transparent 32%),radial-gradient(circle at 82% 70%,rgba(22,140,255,.08),transparent 34%),#030305}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.24) 72%,rgba(0,0,0,.72) 100%)}
main{position:relative;z-index:2;min-height:100svh;width:min(100%,520px);margin:auto;padding:clamp(34px,7vh,72px) 22px 34px;display:flex;flex-direction:column;align-items:center}
.logo{width:min(58vw,260px);height:auto;display:block;filter:drop-shadow(0 0 14px rgba(255,255,255,.06));margin-bottom:clamp(34px,5vh,54px)}
.links{width:100%;display:grid;gap:18px}
.link{--accent:var(--purple);position:relative;min-height:92px;padding:0 23px;border:1px solid color-mix(in srgb,var(--accent) 78%,white 22%);clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 7%,transparent),rgba(4,4,8,.86) 28%,rgba(4,4,8,.91) 72%,color-mix(in srgb,var(--accent) 7%,transparent));display:grid;grid-template-columns:50px 1fr 28px;align-items:center;gap:16px;color:white;text-decoration:none;letter-spacing:.16em;text-transform:uppercase;box-shadow:0 0 15px color-mix(in srgb,var(--accent) 18%,transparent),inset 0 0 18px rgba(255,255,255,.018);transition:.2s ease}
.link.blue{--accent:var(--blue)}
.link:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 0 38%,color-mix(in srgb,var(--accent) 28%,transparent) 50%,transparent 62%);transform:translateX(-120%);animation:scan 6s ease-in-out infinite}
.link:nth-child(2):before{animation-delay:1.3s}.link:nth-child(3):before{animation-delay:2.6s}.link:nth-child(4):before{animation-delay:3.9s}
@keyframes scan{0%,68%{transform:translateX(-120%)}88%,100%{transform:translateX(120%)}}
.link:hover,.link:active{transform:translateY(-2px);box-shadow:0 0 25px color-mix(in srgb,var(--accent) 32%,transparent),inset 0 0 22px color-mix(in srgb,var(--accent) 8%,transparent)}
.icon{width:42px;height:42px;display:grid;place-items:center;color:var(--accent);filter:drop-shadow(0 0 7px var(--accent))}
.icon svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:clamp(15px,4vw,19px);line-height:1.25}
.arrow{font:300 38px/1 Arial;color:var(--accent);filter:drop-shadow(0 0 6px var(--accent))}
footer{margin-top:auto;padding-top:38px;font-family:Besan,Arial,sans-serif;font-size:9px;letter-spacing:.32em;color:rgba(255,255,255,.34);text-transform:uppercase}
@media(max-width:380px){main{padding-left:16px;padding-right:16px}.link{min-height:82px;padding:0 17px;grid-template-columns:43px 1fr 22px;gap:11px}.label{font-size:14px;letter-spacing:.12em}}
@media(prefers-reduced-motion:reduce){.link:before{animation:none}}
</style>
</head>
<body>
<canvas id="network" aria-hidden="true"></canvas><div class="vignette"></div>
<main>
<img class="logo" src="./logo-enigma.png" alt="ENIGMA">
<section class="links" aria-label="Links da Enigma">
<a class="link" href="https://wa.me/5522992629718" target="_blank" rel="noopener"><span class="icon"><svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5Z"/><path d="M9 8.5c.4 2.3 2.2 4.1 4.5 4.8l1.3-1.1 2 .9c.2.1.3.3.2.6-.5 1.4-1.6 2-3 1.8-3.7-.6-6.6-3.5-7.2-7.2-.2-1.4.4-2.5 1.8-3 .3-.1.5 0 .6.2l.9 2-1.1 1Z"/></svg></span><span class="label">WhatsApp</span><span class="arrow">›</span></a>
<a class="link" href="https://www.instagram.com/siga.enigma?igsi=dHE1bDIxODNyaHp5" target="_blank" rel="noopener"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".7" fill="currentColor" stroke="none"/></svg></span><span class="label">Instagram</span><span class="arrow">›</span></a>
<a class="link blue" href="https://g.page/r/CY1iEf8BkpyWEBM/review" target="_blank" rel="noopener"><span class="icon"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg></span><span class="label">Avaliações no Google</span><span class="arrow">›</span></a>
<a class="link blue" href="https://maps.app.goo.gl/KqEuyUaUb1WfUXNQA" target="_blank" rel="noopener"><span class="icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span class="label">Localização</span><span class="arrow">›</span></a>
</section>
<footer>Você encontrou o Enigma</footer>
</main>
<script>
const c=document.getElementById('network'),x=c.getContext('2d');let W,H,dpr,nodes=[],edges=[],pulses=[];
const PUR=[138,46,255],BLU=[22,140,255];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);build()}
function build(){nodes=[];edges=[];pulses=[];const r=Math.max(42,Math.min(62,W/7)),dx=Math.sqrt(3)*r,dy=1.5*r;let rows=Math.ceil(H/dy)+3,cols=Math.ceil(W/dx)+3;
for(let row=-2;row<rows;row++)for(let col=-2;col<cols;col++){let px=col*dx+(row%2?dx/2:0),py=row*dy;nodes.push({x:px,y:py,row,col})}
const map=new Map(nodes.map((n,i)=>[n.row+','+n.col,i]));
nodes.forEach((n,i)=>{[[0,1],[1,0],[1,n.row%2?1:-1]].forEach(([dr,dc])=>{let j=map.get((n.row+dr)+','+(n.col+dc));if(j!=null)edges.push([i,j])})});
for(let i=0;i<Math.max(8,Math.floor(W*H/65000));i++)spawn(true)}
function spawn(random=false){let e=edges[Math.floor(Math.random()*edges.length)];pulses.push({e,t:random?Math.random():0,s:.0016+Math.random()*.0018,color:Math.random()<.5?PUR:BLU,life:.55+Math.random()*.45})}
function line(a,b,alpha,color,width=1){x.strokeStyle=`rgba(${color[0]},${color[1]},${color[2]},${alpha})`;x.lineWidth=width;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}
let last=performance.now(),spawnClock=0;
function draw(now){let dt=Math.min(40,now-last);last=now;x.clearRect(0,0,W,H);
edges.forEach((e,k)=>{let a=nodes[e[0]],b=nodes[e[1]],mid=(a.x+b.x)/2,col=mid<W/2?PUR:BLU;line(a,b,.075,col,.7)});
spawnClock+=dt;if(spawnClock>420){spawnClock=0;if(pulses.length<24)spawn()}
pulses.forEach(p=>{p.t+=p.s*dt;let a=nodes[p.e[0]],b=nodes[p.e[1]],t=p.t,q={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};line(a,b,.12,p.color,1);
let grad=x.createRadialGradient(q.x,q.y,0,q.x,q.y,15);grad.addColorStop(0,`rgba(${p.color[0]},${p.color[1]},${p.color[2]},.95)`);grad.addColorStop(.25,`rgba(${p.color[0]},${p.color[1]},${p.color[2]},.42)`);grad.addColorStop(1,`rgba(${p.color[0]},${p.color[1]},${p.color[2]},0)`);x.fillStyle=grad;x.beginPath();x.arc(q.x,q.y,15,0,Math.PI*2);x.fill();
x.fillStyle=`rgb(${p.color.join(',')})`;x.beginPath();x.arc(q.x,q.y,2.2,0,Math.PI*2);x.fill()});
pulses=pulses.filter(p=>p.t<1);requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();requestAnimationFrame(draw);
</script>
</body></html>
