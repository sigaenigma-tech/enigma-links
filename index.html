<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050507" />
  <title>ENIGMA | Links Oficiais</title>
  <meta name="description" content="Links oficiais da ENIGMA — WhatsApp, Instagram, avaliações e localização." />
  <style>
    :root{
      --bg:#050507;
      --text:#f7f7fb;
      --muted:#b6b6c2;
      --purple:#9b35ff;
      --purple2:#6f20ff;
      --blue:#2487ff;
      --blue2:#005dff;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{
      min-height:100svh;
      overflow-x:hidden;
      font-family:"Besan","Eurostile","Orbitron","Arial Narrow",Arial,sans-serif;
      background:#050507;
    }
    a{color:inherit;text-decoration:none}

    /* ===== FUNDO ANIMADO ===== */
    .cyber-bg{
      position:fixed;
      inset:0;
      overflow:hidden;
      pointer-events:none;
      z-index:0;
      background:
        radial-gradient(circle at 13% 16%,rgba(139,37,255,.13),transparent 28%),
        radial-gradient(circle at 88% 28%,rgba(23,111,255,.12),transparent 31%),
        radial-gradient(circle at 77% 82%,rgba(40,99,255,.08),transparent 34%),
        linear-gradient(180deg,#030305 0%,#07070a 48%,#030305 100%);
    }

    .cyber-bg::after{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.46) 100%);
      z-index:3;
    }

    .network{
      position:absolute;
      inset:-7%;
      width:114%;
      height:114%;
      opacity:.78;
      z-index:1;
    }

    .hex-grid{opacity:.25}
    .hex-line{fill:none;stroke:rgba(120,91,180,.22);stroke-width:.72}

    .electric{
      fill:none;
      stroke:url(#electricGradient);
      stroke-width:1.15;
      stroke-linecap:round;
      stroke-dasharray:3 12 20 18;
      filter:url(#softGlow);
      opacity:.72;
      animation:energyFlow 14s linear infinite;
    }
    .electric.e2{animation-duration:19s;animation-delay:-6s;opacity:.55}
    .electric.e3{animation-duration:16s;animation-delay:-11s;opacity:.6}
    .electric.e4{animation-duration:22s;animation-delay:-3s;opacity:.42}

    .node{
      transform-box:fill-box;
      transform-origin:center;
      filter:url(#nodeGlow);
      animation:nodePulse 5.6s ease-in-out infinite;
    }
    .node.purple{fill:#a33cff}
    .node.blue{fill:#247cff}
    .node.n2{animation-delay:-1.7s}.node.n3{animation-delay:-3.4s}.node.n4{animation-delay:-4.8s}.node.n5{animation-delay:-2.3s}.node.n6{animation-delay:-.8s}

    .orb{
      position:absolute;
      border-radius:999px;
      filter:blur(2px);
      opacity:.2;
      animation:floatOrb 13s ease-in-out infinite;
      z-index:2;
    }
    .orb.one{width:190px;height:190px;left:-80px;top:28%;background:radial-gradient(circle,rgba(149,43,255,.36),transparent 67%)}
    .orb.two{width:220px;height:220px;right:-105px;top:56%;background:radial-gradient(circle,rgba(25,112,255,.32),transparent 68%);animation-delay:-6s}

    @keyframes energyFlow{to{stroke-dashoffset:-240}}
    @keyframes nodePulse{0%,100%{opacity:.22;transform:scale(.75)}50%{opacity:1;transform:scale(1.35)}}
    @keyframes floatOrb{0%,100%{transform:translate3d(0,-12px,0)}50%{transform:translate3d(14px,20px,0)}}

    /* ===== CONTEÚDO ===== */
    .page{
      position:relative;
      z-index:5;
      width:min(100%,520px);
      margin:0 auto;
      min-height:100svh;
      padding:clamp(32px,7vh,68px) 22px calc(28px + env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .brand{text-align:center;margin-bottom:30px}
    .logo{
      display:block;
      width:min(62vw,260px);
      max-height:220px;
      object-fit:contain;
      margin:0 auto 17px;
      filter:drop-shadow(0 0 18px rgba(255,255,255,.035));
    }

    .brand-line{
      width:min(84%,340px);
      height:1px;
      margin:5px auto 20px;
      background:linear-gradient(90deg,transparent,var(--purple),rgba(200,81,255,.9),var(--blue),transparent);
      box-shadow:0 0 12px rgba(139,46,255,.48);
      position:relative;
      overflow:visible;
    }
    .brand-line::after{
      content:"";
      position:absolute;
      width:38px;height:3px;
      left:10%;top:-1px;
      border-radius:4px;
      background:#a944ff;
      box-shadow:0 0 12px #9932ff;
      animation:scanLine 5.7s ease-in-out infinite;
    }
    @keyframes scanLine{0%,100%{left:9%;opacity:.45}50%{left:80%;opacity:1}}

    .tagline{
      margin:0 auto;
      max-width:360px;
      color:#b968ff;
      text-transform:uppercase;
      font-size:clamp(12px,3.25vw,15px);
      line-height:1.65;
      letter-spacing:.22em;
      font-weight:500;
      text-shadow:0 0 18px rgba(151,49,255,.22);
    }

    .links{display:grid;gap:14px}

    .link{
      --accent:var(--purple);
      position:relative;
      min-height:78px;
      display:grid;
      grid-template-columns:52px 1fr 24px;
      align-items:center;
      gap:15px;
      padding:13px 17px;
      background:linear-gradient(180deg,rgba(9,9,14,.82),rgba(3,3,6,.88));
      border:1px solid color-mix(in srgb,var(--accent) 76%,white 8%);
      clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
      box-shadow:0 0 16px color-mix(in srgb,var(--accent) 22%,transparent),inset 0 0 19px rgba(255,255,255,.018);
      transition:transform .2s ease,filter .2s ease;
      isolation:isolate;
      overflow:hidden;
    }
    .link.blue{--accent:var(--blue)}

    .link::before{
      content:"";
      position:absolute;
      inset:1px;
      clip-path:inherit;
      background:
        linear-gradient(90deg,color-mix(in srgb,var(--accent) 25%,transparent),transparent 20% 80%,color-mix(in srgb,var(--accent) 20%,transparent)),
        linear-gradient(180deg,rgba(255,255,255,.015),rgba(0,0,0,.12));
      z-index:-1;
    }
    .link::after{
      content:"";
      position:absolute;
      width:33%;height:130%;
      left:-45%;top:-15%;
      background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 18%,transparent),rgba(255,255,255,.08),transparent);
      transform:skewX(-18deg);
      animation:buttonSweep 7.5s ease-in-out infinite;
      z-index:-1;
    }
    .link:nth-child(2)::after{animation-delay:-1.8s}.link:nth-child(3)::after{animation-delay:-3.4s}.link:nth-child(4)::after{animation-delay:-5.1s}
    @keyframes buttonSweep{0%,58%{left:-48%;opacity:0}68%{opacity:1}82%,100%{left:118%;opacity:0}}

    .link:hover,.link:focus-visible{transform:translateY(-2px) scale(1.005);filter:brightness(1.18);outline:none}
    .link:active{transform:scale(.985)}

    .icon{
      width:48px;height:48px;
      display:grid;place-items:center;
      color:var(--accent);
      filter:drop-shadow(0 0 8px color-mix(in srgb,var(--accent) 70%,transparent));
    }
    .icon svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

    .label{
      font-size:clamp(15px,4vw,18px);
      text-transform:uppercase;
      letter-spacing:.13em;
      line-height:1.25;
      font-weight:500;
    }
    .sub{
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-family:Arial,Helvetica,sans-serif;
      font-size:11px;
      letter-spacing:.02em;
      text-transform:none;
      font-weight:400;
    }
    .arrow{
      color:var(--accent);
      font-family:Arial,sans-serif;
      font-size:34px;
      line-height:1;
      font-weight:200;
      filter:drop-shadow(0 0 7px color-mix(in srgb,var(--accent) 70%,transparent));
      transform:translateY(-1px);
    }

    footer{
      width:max-content;
      max-width:100%;
      margin:30px auto 0;
      padding:10px 18px;
      color:#dedee8;
      border-left:1px solid rgba(155,53,255,.75);
      border-right:1px solid rgba(155,53,255,.75);
      font-size:10px;
      letter-spacing:.22em;
      text-transform:uppercase;
      text-align:center;
      background:rgba(8,8,12,.32);
      box-shadow:0 0 18px rgba(128,42,255,.055);
    }

    @media(max-width:380px){
      .page{padding-left:14px;padding-right:14px}
      .link{grid-template-columns:44px 1fr 20px;gap:10px;padding-left:13px;padding-right:13px;min-height:72px}
      .icon{width:42px;height:42px}.icon svg{width:31px;height:31px}
      .label{letter-spacing:.095em}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important}
      .electric{stroke-dasharray:none;opacity:.35}
    }
  </style>
</head>
<body>
  <div class="cyber-bg" aria-hidden="true">
    <svg class="network" viewBox="0 0 430 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="electricGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#9d37ff"/>

          <stop offset="1" stop-color="#1d7cff"/>
        </linearGradient>
        <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.6" result="b"/>

        </filter>

      <circle class="node purple n6" cx="201" cy="697" r="3.6"/>
      <circle class="node blue n5" cx="304" cy="693" r="3.8"/>
    </svg>
    <div class="orb one"></div>
    <div class="orb two"></div>
  </div>

  <main class="page">
    <header class="brand">

    <section class="links" aria-label="Links oficiais da ENIGMA">
      <a class="link" href="https://wa.me/5522992629718" target="_blank" rel="noopener noreferrer" aria-label="Falar com a ENIGMA no WhatsApp">
        <span class="icon" aria-hidden="true">

        </span>
        <span class="label">WhatsApp<span class="sub">Fale com a gente</span></span>
        <span class="arrow" aria-hidden="true">›</span>

      <a class="link" href="https://www.instagram.com/siga.enigma?igsi=dHE1bDIxODNyaHp5" target="_blank" rel="noopener noreferrer" aria-label="Abrir Instagram da ENIGMA">

        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>

        <span class="icon" aria-hidden="true">

</html>
