<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0B" />
  <title>ENIGMA // CONNECT</title>
  <meta name="description" content="Links oficiais da ENIGMA — Instagram, WhatsApp, avaliações e localização." />
  <style>
    :root{
      --bg:#0B0B0B;
      --panel:rgba(15,15,18,.72);
      --line:rgba(255,255,255,.10);
      --text:#F6F6F7;
      --muted:#A9A9B2;
      --purple:#8A2EFF;
      --blue:#2F7BFF;
      --shadow:0 18px 55px rgba(0,0,0,.42);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}
    body{min-height:100svh;display:grid;place-items:center;overflow-x:hidden;position:relative}
    a{color:inherit;text-decoration:none}

    .bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;background:
      radial-gradient(circle at 18% 20%,rgba(138,46,255,.10),transparent 32%),
      radial-gradient(circle at 82% 76%,rgba(47,123,255,.09),transparent 34%),
      linear-gradient(180deg,#080808 0%,#0B0B0B 55%,#09090A 100%)}
    .mesh{position:absolute;inset:-8%;width:116%;height:116%;opacity:.36;filter:drop-shadow(0 0 5px rgba(138,46,255,.04))}
    .hex{fill:none;stroke:rgba(255,255,255,.075);stroke-width:1}
    .net{fill:none;stroke:url(#wire);stroke-width:1.1;stroke-linecap:round;stroke-dasharray:7 18;opacity:.33;animation:flow 16s linear infinite}
    .pulse{fill:url(#node);opacity:.15;animation:pulse 8s ease-in-out infinite}
    .pulse:nth-of-type(2){animation-delay:-2.5s}.pulse:nth-of-type(3){animation-delay:-5s}.pulse:nth-of-type(4){animation-delay:-1.1s}
    @keyframes flow{to{stroke-dashoffset:-180}}
    @keyframes pulse{0%,100%{opacity:.08;transform:scale(.92)}50%{opacity:.28;transform:scale(1.12)}}

    .shell{position:relative;z-index:1;width:min(92vw,460px);padding:34px 18px calc(28px + env(safe-area-inset-bottom));}
    .card{position:relative;border:1px solid rgba(255,255,255,.09);background:linear-gradient(180deg,rgba(16,16,20,.78),rgba(10,10,13,.78));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:28px;padding:32px 22px 22px;box-shadow:var(--shadow);overflow:hidden}
    .card:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(138,46,255,.34),rgba(255,255,255,.03) 38%,rgba(47,123,255,.28));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    .brand{text-align:center;margin-bottom:25px}
    .mark{width:72px;height:72px;margin:0 auto 14px;display:grid;place-items:center;border-radius:22px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.025);box-shadow:inset 0 0 28px rgba(138,46,255,.05),0 0 30px rgba(47,123,255,.05)}
    .mark svg{width:45px;height:45px}
    h1{margin:0;font-size:30px;letter-spacing:.16em;font-weight:800}
    .connect{margin-top:7px;font-size:10px;letter-spacing:.42em;color:#9C9CA6}
    .tag{margin:14px auto 0;font-size:14px;color:#CBCBD1;letter-spacing:.02em}

    .links{display:grid;gap:12px}
    .link{position:relative;display:flex;align-items:center;gap:14px;min-height:70px;padding:14px 16px;border-radius:18px;border:1px solid rgba(255,255,255,.095);background:rgba(255,255,255,.035);overflow:hidden;transition:transform .2s ease,border-color .2s ease,background .2s ease}
    .link:after{content:"";position:absolute;left:-35%;top:0;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(138,46,255,.14),rgba(47,123,255,.10),transparent);transform:skewX(-18deg);transition:left .48s ease}
    .link:hover,.link:focus-visible{transform:translateY(-2px);border-color:rgba(138,46,255,.28);background:rgba(255,255,255,.048);outline:none}
    .link:hover:after,.link:focus-visible:after{left:110%}
    .ico{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(138,46,255,.14),rgba(47,123,255,.10));border:1px solid rgba(255,255,255,.08)}
    .ico svg{width:20px;height:20px;stroke:#fff}
    .txt{min-width:0}.txt b{display:block;font-size:15px;letter-spacing:.02em}.txt span{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
    .arrow{margin-left:auto;color:#B7B7C0;font-size:20px;line-height:1}

    footer{text-align:center;color:#777781;font-size:10px;letter-spacing:.18em;margin-top:18px}
    @media(max-width:360px){.shell{padding-left:12px;padding-right:12px}.card{padding-left:16px;padding-right:16px}h1{font-size:26px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.net{stroke-dasharray:none;opacity:.2}}
  </style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <svg class="mesh" viewBox="0 0 420 860" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A2EFF"/><stop offset=".52" stop-color="#6B43FF"/><stop offset="1" stop-color="#2F7BFF"/></linearGradient>
      <radialGradient id="node"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".3" stop-color="#8A2EFF" stop-opacity=".45"/><stop offset="1" stop-color="#2F7BFF" stop-opacity="0"/></radialGradient>
      <pattern id="hexgrid" width="72" height="62" patternUnits="userSpaceOnUse">
        <path class="hex" d="M18 1h36l18 30-18 30H18L0 31Z"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#hexgrid)"/>
    <path class="net" d="M-20 120 C75 85 118 165 205 138 S340 70 455 118"/>
    <path class="net" d="M-30 325 C80 285 145 385 230 342 S345 270 450 320" style="animation-delay:-6s"/>
    <path class="net" d="M-10 580 C95 530 150 630 245 585 S340 510 450 555" style="animation-delay:-11s"/>
    <path class="net" d="M38 -20 C80 100 34 210 112 302 S225 420 168 540 S128 740 230 900" style="animation-delay:-3s"/>
    <circle class="pulse" cx="94" cy="150" r="38"/>
    <circle class="pulse" cx="300" cy="300" r="44"/>
    <circle class="pulse" cx="126" cy="562" r="36"/>
    <circle class="pulse" cx="326" cy="690" r="42"/>
  </svg>
</div>

<main class="shell">
  <section class="card" aria-label="Links oficiais da ENIGMA">

        <!-- Símbolo temporário geométrico. Substitua pelo arquivo oficial da logo quando quiser. -->

      </div>
      <h1>ENIGMA</h1>

    <div class="links">
      <a class="link" href="https://wa.me/5522992629718" target="_blank" rel="noopener noreferrer" aria-label="Falar com a ENIGMA no WhatsApp">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M20 11.6a8 8 0 0 1-11.8 7l-4.2 1.1 1.1-4.1A8 8 0 1 1 20 11.6Z"/><path d="M8.5 8.2c.4 2.6 2.5 4.8 5.1 5.3"/></svg></div>

        <div class="ico"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg></div>

      <a class="link" href="https://maps.app.goo.gl/KqEuyUaUb1WfUXNQA" target="_blank" rel="noopener noreferrer" aria-label="Abrir localização da ENIGMA no Google Maps">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/></svg></div>
        <div class="txt"><b>Localização</b><span>Como chegar na ENIGMA</span></div><div class="arrow">›</div>
      </a>
    </div>
    <footer>ENIGMA • CABO FRIO — RJ</footer>
  </section>
</main>
</body>
</html>
